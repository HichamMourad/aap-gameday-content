# code: language=ansible
---
- name: Play to Create the SSH key pair in AWS, and machine creds in Ansible controller
  hosts: localhost
  connection: local
  tasks:
    # It is possible to use a pre-existing key-pair, this is done just for simplicity
    - name: Create ssh key pair
      amazon.aws.ec2_key:
        region: "{{ ec2_region | default('us-east-2') }}"
        name: "aws-demo-gameday-key"
        force: true
      register: create_key
#
    - name: Save private key to file
      copy:
        content: "{{ create_key.key.private_key }}"
        dest: 'aws-demo-gameday-key.pem'
        mode: '0600'
      when: create_key.changed

    - name: Create the Machine Credential that will use SSH
      ansible.controller.credential:
        name: AWS gameday Demo Instance SSH credential
        organization: Default
        credential_type: Machine
        state: present
        inputs:
          ssh_key_data: "{{ lookup('file', 'aws-demo-gameday-key.pem') }}"
